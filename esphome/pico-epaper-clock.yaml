substitutions:
  name: pico-epaper-clock
  friendly_name: "Pico ePaper Clock"
  # Waveshare Pico-ePaper-4.2 pin table for a Raspberry Pi Pico/Pico W:
  #   DIN  -> GP11 / SPI MOSI
  #   CLK  -> GP10 / SPI SCK
  #   CS   -> GP9
  #   DC   -> GP8
  #   RST  -> GP12
  #   BUSY -> GP13
  #   KEY0 -> GP15
  #   KEY1 -> GP17
  spi_clk_pin: GPIO10
  spi_mosi_pin: GPIO11
  display_cs_pin: GPIO9
  display_dc_pin: GPIO8
  display_reset_pin: GPIO12
  display_busy_pin: GPIO13
  key0_pin: GPIO15
  key1_pin: GPIO17

packages:
  network: !include shared/network-pico.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  on_boot:
    priority: -100
    then:
      - component.update: epaper_display

external_components:
  - source:
      type: local
      path: components
    components:
      - pico_epaper_4in2_v2

rp2040:
  board: rpipicow

logger:

spi:
  clk_pin: ${spi_clk_pin}
  mosi_pin: ${spi_mosi_pin}

globals:
  # The display is refreshed by the interval below, not by the display
  # component's polling timer. Seconds use partial refresh; minute changes
  # request a full refresh to keep the panel clean.
  - id: last_rendered_second_key
    type: int
    restore_value: false
    initial_value: "-1"
  - id: last_full_refresh_minute_key
    type: int
    restore_value: false
    initial_value: "-1"
  - id: handwriting_font_index
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: last_diagnostic_refresh_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_diagnostic_state
    type: int
    restore_value: false
    initial_value: "-1"
  - id: display_powered_down
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ap_last_client_activity_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

script:
  - id: clear_and_sleep_epaper
    mode: single
    then:
      - lambda: |-
          if (id(display_powered_down)) return;
          id(display_powered_down) = true;
          id(epaper_display).clear_and_deep_sleep();

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (id(display_powered_down)) return false;

              auto now = id(ntp_time).now();
              if (!now.is_valid()) {
                int diagnostic_state = 0;
                if (esphome::wifi::global_wifi_component->is_disabled()) {
                  diagnostic_state = 5;
                } else if (esphome::wifi::global_wifi_component->is_ap_active()) {
                  diagnostic_state = 4;
                } else if (esphome::wifi::global_wifi_component->is_connected()) {
                  diagnostic_state = 1;
                  auto addresses = esphome::wifi::global_wifi_component->wifi_sta_ip_addresses();
                  if (addresses[0].is_set()) {
                    diagnostic_state = 2;
                  }
                }

                uint32_t elapsed = millis() - id(last_diagnostic_refresh_ms);
                if (diagnostic_state == id(last_diagnostic_state) && elapsed < 60000) return false;

                id(last_diagnostic_state) = diagnostic_state;
                id(last_diagnostic_refresh_ms) = millis();
                id(epaper_display).set_full_refresh_next();
                return true;
              }

              id(last_diagnostic_state) = 3;
              int minute_key = now.day_of_year * 1440 + now.hour * 60 + now.minute;
              int second_key = minute_key * 60 + now.second;
              if (second_key == id(last_rendered_second_key)) return false;

              id(last_rendered_second_key) = second_key;
              if (minute_key != id(last_full_refresh_minute_key)) {
                id(last_full_refresh_minute_key) = minute_key;
                uint8_t current_font = id(handwriting_font_index);
                uint8_t next_font = esphome::random_uint32() % 4;
                if (next_font >= current_font) next_font++;
                id(handwriting_font_index) = next_font;
                id(epaper_display).set_full_refresh_next();
              }
              return true;
          then:
            - component.update: epaper_display

  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              if (!esphome::wifi::global_wifi_component->is_ap_active()) return false;

              uint32_t now_ms = millis();
              if (WiFi.softAPgetStationNum() > 0) {
                id(ap_last_client_activity_ms) = now_ms;
                return false;
              }

              if (id(ap_last_client_activity_ms) == 0) {
                id(ap_last_client_activity_ms) = now_ms;
                return false;
              }

              // Shut down an unused AP ten minutes after boot or after the
              // last associated client leaves. Rebooting starts it again.
              return now_ms - id(ap_last_client_activity_ms) >= 600000UL;
          then:
            - wifi.disable
            - lambda: |-
                id(last_diagnostic_state) = 5;
                id(last_diagnostic_refresh_ms) = millis();
                id(epaper_display).set_full_refresh_next();
            - component.update: epaper_display

button:
  - platform: template
    name: "Refresh Display"
    on_press:
      - lambda: |-
          if (id(display_powered_down)) return;
          auto now = id(ntp_time).now();
          if (now.is_valid()) {
            int minute_key = now.day_of_year * 1440 + now.hour * 60 + now.minute;
            id(last_full_refresh_minute_key) = minute_key;
            id(last_rendered_second_key) = minute_key * 60 + now.second;
          }
          id(epaper_display).set_full_refresh_next();
      - component.update: epaper_display

datetime:
  - platform: template
    type: datetime
    id: manual_clock_time
    name: "Set Clock Time"
    update_interval: 1s
    lambda: |-
      auto now = id(ntp_time).now();
      if (!now.is_valid()) return {};
      return now;
    set_action:
      - lambda: |-
          // The web entity supplies local wall time. Convert it using the
          // configured timezone before updating the Pico's system clock.
          x.recalc_timestamp_local();
          if (x.timestamp < 1546300800) {
            ESP_LOGW("manual_time", "Rejected invalid date/time");
            return;
          }

          struct timeval time_value {
            .tv_sec = x.timestamp,
            .tv_usec = 0,
          };
          struct timezone timezone_value = {0, 0};
          if (settimeofday(&time_value, &timezone_value) != 0) {
            ESP_LOGW("manual_time", "Could not set the system clock");
            return;
          }

          id(last_rendered_second_key) = -1;
          id(last_full_refresh_minute_key) = -1;
          id(last_diagnostic_state) = 3;
          id(epaper_display).set_full_refresh_next();
      - component.update: manual_clock_time
      - component.update: epaper_display

binary_sensor:
  - platform: gpio
    id: epaper_key0
    internal: true
    pin:
      number: ${key0_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - script.execute: clear_and_sleep_epaper

  - platform: gpio
    id: epaper_key1
    internal: true
    pin:
      number: ${key1_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - script.execute: clear_and_sleep_epaper

font:
  - file:
      type: gfonts
      family: Caveat
      weight: 700
    id: caveat_time_font
    size: 166
    bpp: 1
    glyphs:
      - "0123456789:"

  - file:
      type: gfonts
      family: Caveat
      weight: 700
    id: caveat_seconds_font
    size: 72
    bpp: 1
    glyphs:
      - "0123456789"

  - file:
      type: gfonts
      family: Pacifico
      weight: 400
    id: pacifico_time_font
    size: 126
    bpp: 1
    glyphs:
      - "0123456789:"

  - file:
      type: gfonts
      family: Pacifico
      weight: 400
    id: pacifico_seconds_font
    size: 68
    bpp: 1
    glyphs:
      - "0123456789"

  - file:
      type: gfonts
      family: Indie Flower
      weight: 400
    id: indie_flower_time_font
    size: 150
    bpp: 1
    glyphs:
      - "0123456789:"

  - file:
      type: gfonts
      family: Indie Flower
      weight: 400
    id: indie_flower_seconds_font
    size: 72
    bpp: 1
    glyphs:
      - "0123456789"

  - file:
      type: gfonts
      family: Permanent Marker
      weight: 400
    id: permanent_marker_time_font
    size: 128
    bpp: 1
    glyphs:
      - "0123456789:"

  - file:
      type: gfonts
      family: Permanent Marker
      weight: 400
    id: permanent_marker_seconds_font
    size: 68
    bpp: 1
    glyphs:
      - "0123456789"

  - file:
      type: gfonts
      family: Amatic SC
      weight: 700
    id: amatic_sc_time_font
    size: 190
    bpp: 1
    glyphs:
      - "0123456789:"

  - file:
      type: gfonts
      family: Amatic SC
      weight: 700
    id: amatic_sc_seconds_font
    size: 84
    bpp: 1
    glyphs:
      - "0123456789"

  # Public-domain 5x7 bitmap font used only for compact startup diagnostics.
  - file: "fonts/5x7.bdf"
    id: diagnostic_font
    glyphs:
      - " ABCDEFGIKLMNOPRSTUWY0123456789.:"

display:
  - platform: pico_epaper_4in2_v2
    id: epaper_display
    cs_pin: ${display_cs_pin}
    dc_pin: ${display_dc_pin}
    reset_pin: ${display_reset_pin}
    busy_pin: ${display_busy_pin}
    partial_refresh: true
    # Fixed seconds window. X/width must stay byte-aligned for the e-paper RAM.
    partial_window:
      x: 96
      y: 150
      width: 208
      height: 140
    update_interval: never
    lambda: |-
      static const int WIDTH = 400;
      static const int HEIGHT = 300;
      static const int CENTER_X = WIDTH / 2;
      static const int CENTER_Y = HEIGHT / 2;
      static const int TIME_BASE_Y = 118;
      static const int SECONDS_BASE_Y = 220;

      it.fill(COLOR_OFF);

      auto now = id(ntp_time).now();
      if (!now.is_valid()) {
        if (esphome::wifi::global_wifi_component->is_disabled()) {
          it.print(CENTER_X, 132, id(diagnostic_font), COLOR_ON, TextAlign::TOP_CENTER, "AP OFF");
          it.print(CENTER_X, 152, id(diagnostic_font), COLOR_ON, TextAlign::TOP_CENTER, "REBOOT TO SET TIME");
          return;
        }

        if (esphome::wifi::global_wifi_component->is_ap_active()) {
          it.print(CENTER_X, 112, id(diagnostic_font), COLOR_ON, TextAlign::TOP_CENTER, "PICO CLOCK AP");
          it.print(CENTER_X, 132, id(diagnostic_font), COLOR_ON, TextAlign::TOP_CENTER, "PICO CLOCK SETUP");
          it.print(CENTER_X, 152, id(diagnostic_font), COLOR_ON, TextAlign::TOP_CENTER, "192.168.4.1");
          it.print(CENTER_X, 172, id(diagnostic_font), COLOR_ON, TextAlign::TOP_CENTER, "SET TIME IN WEB");
          return;
        }

        if (!esphome::wifi::global_wifi_component->is_connected()) {
          it.print(CENTER_X, 132, id(diagnostic_font), COLOR_ON, TextAlign::TOP_CENTER, "WIFI");
          it.print(CENTER_X, 145, id(diagnostic_font), COLOR_ON, TextAlign::TOP_CENTER, "CONNECTING");
          return;
        }

        auto addresses = esphome::wifi::global_wifi_component->wifi_sta_ip_addresses();
        char ip_text[esphome::network::IP_ADDRESS_BUFFER_SIZE] = "NO IP";
        if (addresses[0].is_set()) {
          addresses[0].str_to(ip_text);
        }

        it.print(CENTER_X, 119, id(diagnostic_font), COLOR_ON, TextAlign::TOP_CENTER, "WIFI OK");
        it.print(CENTER_X, 132, id(diagnostic_font), COLOR_ON, TextAlign::TOP_CENTER, ip_text);
        it.print(CENTER_X, 145, id(diagnostic_font), COLOR_ON, TextAlign::TOP_CENTER, "SYNCING TIME");
        return;
      }

      char time_text[6];
      snprintf(time_text, sizeof(time_text), "%02d:%02d", now.hour, now.minute);

      char second_text[3];
      snprintf(second_text, sizeof(second_text), "%02d", now.second);

      auto print_centered_fit = [&](int center_x, int y, esphome::display::BaseFont *font, const char *text) {
        static const int MARGIN = 4;
        int x1;
        int y1;
        int width;
        int height;
        it.get_text_bounds(center_x, y, text, font, TextAlign::CENTER, &x1, &y1, &width, &height);

        int adjusted_x = center_x;
        if (x1 < MARGIN) {
          adjusted_x += MARGIN - x1;
        } else if (x1 + width > WIDTH - MARGIN) {
          adjusted_x -= x1 + width - (WIDTH - MARGIN);
        }
        it.print(adjusted_x, y, font, COLOR_ON, TextAlign::CENTER, text);
      };

      auto draw_time = [&](esphome::display::BaseFont *time_font, esphome::display::BaseFont *seconds_font) {
        static const int VERTICAL_MARGIN = 4;
        int time_x1;
        int time_y1;
        int time_width;
        int time_height;
        int seconds_x1;
        int seconds_y1;
        int seconds_width;
        int seconds_height;
        it.get_text_bounds(CENTER_X, TIME_BASE_Y, time_text, time_font, TextAlign::CENTER, &time_x1, &time_y1,
                           &time_width, &time_height);
        it.get_text_bounds(CENTER_X, SECONDS_BASE_Y, second_text, seconds_font, TextAlign::CENTER, &seconds_x1,
                           &seconds_y1, &seconds_width, &seconds_height);

        int block_top = time_y1 < seconds_y1 ? time_y1 : seconds_y1;
        int time_bottom = time_y1 + time_height;
        int seconds_bottom = seconds_y1 + seconds_height;
        int block_bottom = time_bottom > seconds_bottom ? time_bottom : seconds_bottom;
        int y_offset = CENTER_Y - ((block_top + block_bottom) / 2);
        if (block_top + y_offset < VERTICAL_MARGIN) {
          y_offset += VERTICAL_MARGIN - (block_top + y_offset);
        } else if (block_bottom + y_offset > HEIGHT - VERTICAL_MARGIN) {
          y_offset -= block_bottom + y_offset - (HEIGHT - VERTICAL_MARGIN);
        }

        print_centered_fit(CENTER_X, TIME_BASE_Y + y_offset, time_font, time_text);
        print_centered_fit(CENTER_X, SECONDS_BASE_Y + y_offset, seconds_font, second_text);
      };

      switch (id(handwriting_font_index)) {
        case 1:
          draw_time(id(pacifico_time_font), id(pacifico_seconds_font));
          break;
        case 2:
          draw_time(id(indie_flower_time_font), id(indie_flower_seconds_font));
          break;
        case 3:
          draw_time(id(permanent_marker_time_font), id(permanent_marker_seconds_font));
          break;
        case 4:
          draw_time(id(amatic_sc_time_font), id(amatic_sc_seconds_font));
          break;
        default:
          draw_time(id(caveat_time_font), id(caveat_seconds_font));
          break;
      }
