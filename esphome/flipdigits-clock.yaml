substitutions:
  name: flipdigits-clock
  friendly_name: "Flip Digits Clock"
  # ESP32 UART2 defaults. Connect ESP32 TX to the transceiver board RXD and
  # ESP32 RX to the transceiver board TXD.
  rs485_tx_pin: GPIO17
  rs485_rx_pin: GPIO16
  rs485_baud_rate: "57600"
  startup_address_seconds: "5"
  startup_ip_debug_seconds: "12"
  ip_octet_display_seconds: "2"
  # Logical HH:MM positions mapped to the already-mounted physical modules.
  # The physical left-to-right address order is 2, 3, 0, 1.
  hours_tens_address: "2"
  hours_ones_address: "3"
  minutes_tens_address: "0"
  minutes_ones_address: "1"
  # Many ESP32 DevKitC-style boards/clones use GPIO2 for a controllable blue LED.
  # Official Espressif DevKitC V4 boards may only have a power LED; in that case
  # move this to an external LED pin or remove the status_led block.
  status_led_pin: GPIO2

packages:
  network: !include shared/network.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

status_led:
  pin:
    number: ${status_led_pin}
    inverted: false
    ignore_strapping_warning: true

uart:
  id: flipdigit_uart
  tx_pin: ${rs485_tx_pin}
  rx_pin: ${rs485_rx_pin}
  baud_rate: ${rs485_baud_rate}
  data_bits: 8
  parity: NONE
  stop_bits: 1

globals:
  - id: last_display_code
    type: int
    restore_value: false
    initial_value: "-1"
  - id: manual_display_mode
    type: int
    restore_value: false
    initial_value: "0"
  - id: manual_display_until
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: manual_display_started_at
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: force_refresh_requested
    type: bool
    restore_value: false
    initial_value: "true"

switch:
  - platform: template
    id: display_enabled
    name: "Display Enabled"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: template
    id: test_pattern_seconds
    name: "Test Pattern Duration"
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 6
    unit_of_measurement: "s"
    mode: slider

button:
  - platform: template
    name: "Refresh Display"
    on_press:
      - lambda: |-
          id(force_refresh_requested) = true;

  - platform: template
    name: "Test All Segments"
    on_press:
      - lambda: |-
          id(manual_display_mode) = 1;
          id(manual_display_started_at) = millis();
          id(manual_display_until) = millis() + (uint32_t) (id(test_pattern_seconds).state * 1000.0f);
          id(force_refresh_requested) = true;

  - platform: template
    name: "Show Dashes"
    on_press:
      - lambda: |-
          id(manual_display_mode) = 2;
          id(manual_display_started_at) = millis();
          id(manual_display_until) = millis() + (uint32_t) (id(test_pattern_seconds).state * 1000.0f);
          id(force_refresh_requested) = true;

  - platform: template
    name: "Walk Raw Segments"
    on_press:
      - lambda: |-
          id(manual_display_mode) = 3;
          id(manual_display_started_at) = millis();
          id(manual_display_until) = millis() + 7000UL;
          id(force_refresh_requested) = true;

interval:
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t STARTUP_ADDRESS_MS = ${startup_address_seconds} * 1000UL;
          const uint32_t STARTUP_IP_DEBUG_MS = ${startup_ip_debug_seconds} * 1000UL;
          const uint32_t IP_OCTET_MS = ${ip_octet_display_seconds} * 1000UL;

          static const uint8_t DIGIT_ADDRESSES[4] = {
            ${hours_tens_address},
            ${hours_ones_address},
            ${minutes_tens_address},
            ${minutes_ones_address},
          };
          // The patterns array is always logical left-to-right. This address
          // table applies the mounted 2,3,0,1 correction to every display mode.

          // Raw segment order observed with Walk Raw Segments:
          // B6 middle, then B5..B0 from upper-left counter-clockwise.
          static const uint8_t SEGMENTS_FOR_DIGIT[10] = {
            0x3F, // 0
            0x06, // 1
            0x5B, // 2
            0x4F, // 3
            0x66, // 4
            0x6D, // 5
            0x7D, // 6
            0x07, // 7
            0x7F, // 8
            0x6F, // 9
          };
          const uint8_t SEGMENT_BLANK = 0x00;
          const uint8_t SEGMENT_DASH = 0x40;

          static uint32_t startup_started_at = 0;
          static uint32_t wifi_connected_at = 0;
          static uint32_t ip_display_started_at = 0;
          static bool ip_octets_ready = false;
          static bool ip_debug_complete = false;
          static int ip_octets[4] = {0, 0, 0, 0};

          uint8_t patterns[4] = {
            SEGMENT_BLANK,
            SEGMENT_BLANK,
            SEGMENT_BLANK,
            SEGMENT_BLANK,
          };
          int display_code = 0;

          auto set_all = [&](uint8_t pattern) {
            for (uint8_t i = 0; i < 4; i++) {
              patterns[i] = pattern;
            }
          };

          auto set_startup_position_digits = [&]() {
            for (uint8_t i = 0; i < 4; i++) {
              patterns[i] = SEGMENTS_FOR_DIGIT[i];
            }
          };

          auto set_ip_octet = [&](uint8_t octet_index) {
            int value = ip_octets[octet_index];
            if (value < 0) value = 0;
            if (value > 255) value = 255;

            patterns[0] = SEGMENT_BLANK;
            patterns[1] = SEGMENTS_FOR_DIGIT[value / 100];
            patterns[2] = SEGMENTS_FOR_DIGIT[(value / 10) % 10];
            patterns[3] = SEGMENTS_FOR_DIGIT[value % 10];
          };

          auto set_time = [&](const esphome::ESPTime &now) {
            patterns[0] = SEGMENTS_FOR_DIGIT[now.hour / 10];
            patterns[1] = SEGMENTS_FOR_DIGIT[now.hour % 10];
            patterns[2] = SEGMENTS_FOR_DIGIT[now.minute / 10];
            patterns[3] = SEGMENTS_FOR_DIGIT[now.minute % 10];
          };

          uint32_t now_ms = millis();
          if (startup_started_at == 0) {
            startup_started_at = now_ms;
          }

          bool manual_active = (int32_t) (id(manual_display_until) - now_ms) > 0;

          if (!id(display_enabled).state) {
            display_code = 0;
            set_all(SEGMENT_BLANK);
          } else if (manual_active && id(manual_display_mode) == 1) {
            display_code = 40001;
            set_all(SEGMENTS_FOR_DIGIT[8]);
          } else if (manual_active && id(manual_display_mode) == 2) {
            display_code = 40002;
            set_all(SEGMENT_DASH);
          } else if (manual_active && id(manual_display_mode) == 3) {
            uint8_t raw_bit = 6 - (((now_ms - id(manual_display_started_at)) / 1000UL) % 7);
            display_code = 41000 + raw_bit;
            set_all((uint8_t) (1 << raw_bit));
          } else if (now_ms - startup_started_at < STARTUP_ADDRESS_MS) {
            // Software-corrected position check: the visible display should
            // read 0123 even though the mounted address order is 2,3,0,1.
            id(manual_display_mode) = 0;
            display_code = 50000;
            set_startup_position_digits();
          } else if (id(ntp_time).now().is_valid()) {
            id(manual_display_mode) = 0;
            auto now = id(ntp_time).now();
            int minute_of_day = now.hour * 60 + now.minute;
            display_code = 10000 + minute_of_day;
            set_time(now);
          } else if (!esphome::wifi::global_wifi_component->is_connected()) {
            id(manual_display_mode) = 0;
            wifi_connected_at = 0;
            ip_display_started_at = 0;
            ip_octets_ready = false;
            ip_debug_complete = false;
            display_code = 20000;
            set_all(SEGMENT_DASH);
          } else {
            id(manual_display_mode) = 0;
            if (wifi_connected_at == 0) {
              wifi_connected_at = now_ms;
              ip_display_started_at = 0;
              ip_octets_ready = false;
              ip_debug_complete = false;
            }

            if (!ip_octets_ready) {
              auto addresses = esphome::wifi::global_wifi_component->wifi_sta_ip_addresses();
              if (addresses[0].is_set() && addresses[0].is_ip4()) {
                char ip_text[esphome::network::IP_ADDRESS_BUFFER_SIZE];
                addresses[0].str_to(ip_text);
                if (sscanf(ip_text, "%d.%d.%d.%d", &ip_octets[0], &ip_octets[1], &ip_octets[2], &ip_octets[3]) == 4) {
                  for (uint8_t i = 0; i < 4; i++) {
                    if (ip_octets[i] < 0) ip_octets[i] = 0;
                    if (ip_octets[i] > 255) ip_octets[i] = 255;
                  }
                  ip_octets_ready = true;
                  ip_display_started_at = now_ms;
                }
              }
            }

            auto now = id(ntp_time).now();
            if (!ip_octets_ready) {
              display_code = 30000;
              set_all(SEGMENT_DASH);
            } else if (!ip_debug_complete || !now.is_valid()) {
              uint32_t ip_elapsed_ms = now_ms - ip_display_started_at;
              if (now.is_valid() && ip_elapsed_ms >= STARTUP_IP_DEBUG_MS) {
                ip_debug_complete = true;
                int minute_of_day = now.hour * 60 + now.minute;
                display_code = 10000 + minute_of_day;
                set_time(now);
              } else {
                uint8_t octet_index = (ip_elapsed_ms / IP_OCTET_MS) % 4;
                display_code = 60000 + octet_index * 1000 + ip_octets[octet_index];
                set_ip_octet(octet_index);
              }
            } else {
              int minute_of_day = now.hour * 60 + now.minute;
              display_code = 10000 + minute_of_day;
              set_time(now);
            }
          }

          if (!id(force_refresh_requested) && display_code == id(last_display_code)) {
            return;
          }

          id(force_refresh_requested) = false;
          id(last_display_code) = display_code;

          for (uint8_t i = 0; i < 4; i++) {
            uint8_t frame[5] = {
              0x80,
              0x89,
              DIGIT_ADDRESSES[i],
              (uint8_t) (patterns[i] & 0x7F),
              0x8F,
            };
            id(flipdigit_uart).write_array(frame, sizeof(frame));
          }
