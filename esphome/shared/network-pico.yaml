# Shared network settings for ESPHome Pico W devices.
#
# Pico W skips the local web server to avoid pulling ESPAsyncWebServer into the
# RP2040/Arduino build. ESPHome enterprise Wi-Fi is not available on RP2040, so
# the EMF event network uses the open emf-open SSID.
#
# Values are loaded from esphome/secrets.yaml, which is gitignored. Copy
# esphome/secrets.example.yaml to esphome/secrets.yaml before validating or
# flashing.
substitutions:
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  timezone: !secret timezone

wifi:
  networks:
    - ssid: "${wifi_ssid}"
      password: "${wifi_password}"
    - ssid: "emf-open"

ota:
  - platform: esphome
    password: "${ota_password}"

time:
  - platform: sntp
    id: ntp_time
    timezone: "${timezone}"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
