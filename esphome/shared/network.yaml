# Shared network settings for ESPHome devices in this project.
#
# Values are loaded from esphome/secrets.yaml, which is gitignored. Copy
# esphome/secrets.example.yaml to esphome/secrets.yaml before validating or
# flashing.
substitutions:
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  web_username: !secret web_username
  web_password: !secret web_password
  ota_password: !secret ota_password
  timezone: !secret timezone

wifi:
  networks:
    - ssid: "${wifi_ssid}"
      password: "${wifi_password}"
    - ssid: "emf"
      eap:
        username: "emf"
        password: "emf"
  # These clocks only need Wi-Fi long enough to obtain time and OTA access.
  # Keep them running if the station connection later goes away.
  reboot_timeout: 0s

web_server:
  port: 80
  version: 3
  local: true
  auth:
    username: "${web_username}"
    password: "${web_password}"

ota:
  - platform: esphome
    password: "${ota_password}"

time:
  - platform: sntp
    id: ntp_time
    timezone: "${timezone}"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
