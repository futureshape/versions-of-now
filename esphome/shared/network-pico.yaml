# Shared network settings for ESPHome Pico W devices.
#
# The Pico W runs as an access point and serves its local web UI at
# 192.168.4.1. It does not attempt to join a station network first.
#
# Values are loaded from esphome/secrets.yaml, which is gitignored. Copy
# esphome/secrets.example.yaml to esphome/secrets.yaml before validating or
# flashing.
substitutions:
  web_password: !secret web_password
  ota_password: !secret ota_password
  timezone: !secret timezone

wifi:
  ap:
    ssid: "Pico Clock Setup"
    password: "${web_password}"
  # Stay available in AP mode instead of periodically rebooting the clock.
  reboot_timeout: 0s

web_server:
  port: 80
  version: 3
  local: true

ota:
  - platform: esphome
    password: "${ota_password}"

time:
  - platform: sntp
    id: ntp_time
    timezone: "${timezone}"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
